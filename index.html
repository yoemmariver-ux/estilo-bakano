<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Urbana - Estilo Bakano</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Snipcart -->
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.css" />
  <script async src="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.js"></script>
  <div hidden id="snipcart" data-api-key="TU_API_KEY_DE_SNIPCART"></div>
</head>
<body>
  <!-- Header con marca -->
  <header>
    <img src="images/estilobakanotitulo.jpeg" alt="Estilo Bakano" class="banner">
    <h1>Tienda Urbana</h1>
    <button class="snipcart-checkout">🛒 Carrito</button>
  </header>

  <!-- Catálogo -->
  <main>
    <section class="producto">
      <img src="images/camiseta.jpg" alt="Camiseta Oversize">
      <h2>Camiseta Oversize</h2>
      <p>$4500</p>
      <button 
        class="snipcart-add-item"
        data-item-id="camiseta-oversize"
        data-item-name="Camiseta Oversize"
        data-item-price="4500"
        data-item-url="/"
        data-item-description="Camiseta estilo urbano oversize">
        Agregar al carrito
      </button>
      <!-- Botón MercadoPago -->
      <form action="https://www.mercadopago.com.ar/checkout/v1/redirect" method="POST">
        <input type="hidden" name="pref_id" value="PREFERENCE_ID_CAMISETA">
        <button type="submit">Comprar con MercadoPago</button>
      </form>
    </section>

    <section class="producto">
      <img src="images/buzo.jpg" alt="Buzo Hoodie">
      <h2>Buzo Hoodie</h2>
      <p>$8500</p>
      <button 
        class="snipcart-add-item"
        data-item-id="buzo-hoodie"
        data-item-name="Buzo Hoodie"
        data-item-price="8500"
        data-item-url="/"
        data-item-description="Buzo urbano con capucha">
        Agregar al carrito
      </button>
      <form action="https://www.mercadopago.com.ar/checkout/v1/redirect" method="POST">
        <input type="hidden" name="pref_id" value="PREFERENCE_ID_BUZO">
        <button type="submit">Comprar con MercadoPago</button>
      </form>
    </section>
  </main>

  <!-- Footer con redes -->
  <footer>
    <div class="redes">
      <a href="https://facebook.com/TuPagina" target="_blank">
        <img src="images/facebook.png" alt="Facebook" class="icono-red">
      </a>
      <a href="https://instagram.com/TuPagina" target="_blank">
        <img src="images/instagram.png" alt="Instagram" class="icono-red">
      </a>
      <a href="https://wa.me/549383XXXXXXX" target="_blank">
        <img src="images/watsapp.png" alt="WhatsApp" class="icono-red">
      </a>
      <a href="https://maps.google.com/?q=TuUbicacion" target="_blank">
        <img src="images/ubicacion.png" alt="Ubicación" class="icono-red">
      </a>
    </div>
    <p>📲 Atención personalizada por WhatsApp</p>
  </footer>
</body>
</html>
