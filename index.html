<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Urbana</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Ropa Urbana</h1>
  </header>

  <main>
    <!-- Producto 1 -->
    <section class="producto">
      <img src="camiseta.jpg" alt="Camiseta Oversize">
      <h2>Camiseta Oversize</h2>
      <p>$4500</p>
      <div id="walletBrick_camiseta"></div>
    </section>

    <!-- Producto 2 -->
    <section class="producto">
      <img src="buzo.jpg" alt="Buzo Hoodie">
      <h2>Buzo Hoodie</h2>
      <p>$8500</p>
      <div id="walletBrick_buzo"></div>
    </section>

    <!-- Producto 3 -->
    <section class="producto">
      <img src="cargo.jpg" alt="Pantalón Cargo">
      <h2>Pantalón Cargo</h2>
      <p>$6500</p>
      <div id="walletBrick_cargo"></div>
    </section>
  </main>

  <footer>
    <p>📲 <a href="https://wa.me/549383XXXXXXX">Contactanos por WhatsApp</a></p>
  </footer>

  <!-- SDK MercadoPago -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script>
    // Configura tu Public Key de MercadoPago
    const mp = new MercadoPago("TU_PUBLIC_KEY");

    const bricksBuilder = mp.bricks();

    // Renderizar botones de pago para cada producto
    const renderWalletBrick = async (id, preferenceId) => {
      await bricksBuilder.create("wallet", id, {
        initialization: {
          preferenceId: preferenceId
        }
      });
    };

    // Reemplaza con los preferenceId que generes desde tu backend
    renderWalletBrick("walletBrick_camiseta", "PREFERENCE_ID_CAMISETA");
    renderWalletBrick("walletBrick_buzo", "PREFERENCE_ID_BUZO");
    renderWalletBrick("walletBrick_cargo", "PREFERENCE_ID_CARGO");
  </script>
</body>
</html>
