<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estilo Bakano</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- Header con logos de marca -->
  <header>
    <div class="logo-container">
      <img src="images/logo1.png" alt="Estilo Bakano Logo">
      <img src="images/logo2.png" alt="BK Logo">
    </div>
    <div class="cart-icon-container" onclick="toggleCart()">
      🛒 <span id="cart-count" class="cart-badge">0</span>
    </div>
  </header>

  <!-- Filtro de Categorías -->
  <nav class="categories-nav">
    <button class="btn-cat active">Todos</button>
    <button class="btn-cat">Camperas</button>
    <button class="btn-cat">Joggers</button>
    <button class="btn-cat">Accesorios</button>
  </nav>

  <!-- Catálogo de Productos -->
  <main>
    <section id="catalogo" class="catalogo-grid">
      <!-- Los productos se cargan dinámicamente o podés maquetarlos manualmente -->
    </section>
  </main>

  <!-- Drawer / Carrito Lateral -->
  <div id="cart-overlay" class="cart-drawer-overlay" onclick="toggleCart()"></div>
  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h2>Tu Carrito</h2>
      <button onclick="toggleCart()" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <div id="cart-body" class="cart-body">
      <!-- Items agregados -->
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-price">$0</span>
      </div>
      <button class="btn-whatsapp" onclick="enviarWhatsApp()">
        Pedir por WhatsApp
      </button>
    </div>
  </aside>

  <!-- Footer / Redes Sociales -->
  <footer>
    <div class="social-icons">
      <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
      <a href="#"><img src="images/whatsapp.png" alt="WhatsApp"></a>
      <a href="#"><img src="images/maps.png" alt="Ubicación"></a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
